name: End-to-End Tests

on:
  # Every pull request, including ones stacked on another branch
  pull_request:
  push:
    branches:
      - main
  # A release runs this test on the tagged commit before it builds
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces the run it supersedes
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  envoy:
    name: End-to-End (Envoy ${{ matrix.envoy }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The latest release of Envoy's two newest minors
        envoy: ["1.39.6", "1.40.2"]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Envoy with examples/envoy.yaml, crawl-signer, OpenBao and an origin
      # that verifies the signatures, in containers on the runner: no
      # account, no secret. Prints the containers' logs on failure.
      - name: Test
        id: e2e
        env:
          ENVOY_VERSION: ${{ matrix.envoy }}
        run: make e2e

  # One check to require for merging, whatever versions the matrix holds
  result:
    name: End-to-End
    needs: envoy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Every Envoy version passed
        id: result
        env:
          RESULT: ${{ needs.envoy.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::the end-to-end test did not pass for every Envoy version: ${RESULT}"
            exit 1
          fi
