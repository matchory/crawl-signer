name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      PREFIX: s3://matchory-artifacts/crawl-signer/${{ github.ref_name }}/
      ENDPOINT: https://fsn1.your-objectstorage.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vX.Y.Z"; exit 1; }'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build
        run: |
          version=${TAG#v}
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/crawl-signer-$version-linux-$arch" ./cmd/crawl-signer
          done
          cd dist && sha256sum crawl-signer-* > checksums.txt && cat checksums.txt
      - name: Refuse an existing version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: fsn1
        run: |
          # shellcheck disable=SC2016 # the backticks are a JMESPath literal
          n=$(aws s3api list-objects-v2 --endpoint-url "$ENDPOINT" \
            --bucket matchory-artifacts --prefix "crawl-signer/$TAG/" \
            --query 'length(Contents || `[]`)' --output text)
          if [ "$n" != 0 ]; then
            echo "$PREFIX already holds $n objects; releases are never overwritten"
            exit 1
          fi
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: fsn1
        run: |
          for f in dist/*; do
            aws s3 cp --endpoint-url "$ENDPOINT" "$f" "$PREFIX"
          done
